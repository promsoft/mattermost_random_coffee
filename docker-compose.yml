services:
  coffeebot:
    # Готовый образ из Docker Hub (собирается GitHub Actions из main).
    # Деплой:           docker compose pull && docker compose up -d
    # Локальная сборка: docker compose up -d --build
    image: promsoft/mattermost-random-coffee:latest
    build: .
    container_name: coffeebot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/coffee.db
      TZ: Europe/Moscow
      HTTP_HOST: 0.0.0.0  # внутри контейнера; наружу порт открыт только на localhost
    ports:
      # Эндпоинт кнопок, только с хоста (healthz/отладка; MM в общей docker-сети
      # ходит напрямую). Если 9000 на хосте занят — задайте HTTP_PUBLISH_PORT в .env
      - "127.0.0.1:${HTTP_PUBLISH_PORT:-9000}:9000"
    volumes:
      - coffee-data:/data
    # Если Mattermost доступен только на localhost хоста (не по публичному URL),
    # раскомментируйте host-режим сети и используйте MM_URL=http://localhost:8065
    # network_mode: host

volumes:
  coffee-data:
