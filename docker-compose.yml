services:
  coffeebot:
    build: .
    container_name: coffeebot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/coffee.db
      TZ: Europe/Moscow
      HTTP_HOST: 0.0.0.0  # внутри контейнера; наружу порт открыт только на localhost
    ports:
      - "127.0.0.1:9000:9000"  # эндпоинт кнопок: доступен только с хоста (для Mattermost)
    volumes:
      - coffee-data:/data
    # Если Mattermost доступен только на localhost хоста (не по публичному URL),
    # раскомментируйте host-режим сети и используйте MM_URL=http://localhost:8065
    # network_mode: host

volumes:
  coffee-data:
