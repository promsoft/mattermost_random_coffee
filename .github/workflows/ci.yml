name: CI & Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Еженедельная пересборка: подтягивает патчи базового образа (CVE-фиксы),
    # даже когда в коде нет изменений. Пн 04:30 UTC — до утреннего матчинга
    - cron: "30 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  docker:
    needs: test
    # Публикуем из main, по тегам v* и еженедельным расписанием; для PR — лишь тесты
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: promsoft/mattermost-random-coffee
          tags: |
            # push в main → latest + sha-<короткий хэш>
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            # git-тег v1.2.3 → 1.2.3 и 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true  # свежий базовый образ при каждой сборке
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
